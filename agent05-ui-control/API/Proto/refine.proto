syntax = "proto3";

option csharp_namespace = "TranslationImprover.Proto";

package translation_improver.refine;

service RefinerService {
  rpc SubmitRefineJob(SubmitRefineJobRequest) returns (SubmitRefineJobResponse);
  rpc GetRefineStatus(GetRefineStatusRequest) returns (RefineStatusResponse);
  rpc StreamRefineStatus(StreamRefineStatusRequest) returns (stream RefineStatusUpdate);
  rpc CancelRefineJob(CancelRefineJobRequest) returns (CancelRefineJobResponse);
  rpc QueryRefineJobs(QueryRefineJobsRequest) returns (QueryRefineJobsResponse);
  // Built-in prompts, so the operator can start editing from the default template.
  rpc GetRefineDefaults(GetRefineDefaultsRequest) returns (GetRefineDefaultsResponse);
}

message SubmitRefineJobRequest {
  string input_file_path = 1;
  string input_content = 2;
  string output_file_path = 3;
  int32 batch_size = 4;
  int32 context_lines = 5;
  string model = 6;
  float temperature = 7;
  string prompt_file = 8;
  string openai_base_url = 9;
  string openai_organization = 10;
  bool save_intermediate = 11;
  string intermediate_dir = 12;
  string callback_url = 13;
  repeated string tags = 14;
  /// Optional. Single segment under workspace_root (Xtract job folder). When set, input/output/intermediate paths resolve under workspace_root/job_directory_relative.
  string job_directory_relative = 15;
  string system_prompt = 16;          // optional; empty = built-in system prompt
}

message SubmitRefineJobResponse {
  string job_id = 1;
}

message GetRefineStatusRequest {
  string job_id = 1;
}

message RefineStatusResponse {
  string job_id = 1;
  string state = 2;
  int32 progress_percent = 3;
  string current_phase = 4;
  int32 current_batch = 5;
  int32 total_batches = 6;
  string output_file_path = 7;
  string error_message = 8;
  string created_at = 9;
  string started_at = 10;
  string completed_at = 11;
  string updated_at = 12;
  repeated string tags = 13;
}

message StreamRefineStatusRequest {
  string job_id = 1;
}

message RefineBatchDelta {
  int32 index = 1;
  int32 total = 2;
  string original_text = 3;
  string refined_text = 4;
  bool ok = 5;
  string error = 6;
  string context_text = 7;    // lines from the previous refined batch sent as context (the seam)
  int32 start_line = 8;       // 1-based first content line of this batch
  int32 end_line = 9;         // 1-based last content line of this batch
}

message RefineStatusUpdate {
  string job_id = 1;
  string state = 2;
  int32 progress_percent = 3;
  string current_phase = 4;
  int32 current_batch = 5;
  int32 total_batches = 6;
  string output_file_path = 7;
  string error_message = 8;
  string updated_at = 9;
  string prompt_preview = 10;
  repeated RefineBatchDelta batches = 11;
}

message CancelRefineJobRequest {
  string job_id = 1;
}

message CancelRefineJobResponse {
  bool cancelled = 1;
}

message QueryRefineJobsRequest {
  string semantic_key = 1;
  string status = 2;
  string from = 3;
  string to = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message QueryRefineJobsResponse {
  repeated RefineStatusResponse jobs = 1;
}

message GetRefineDefaultsRequest {}

message GetRefineDefaultsResponse {
  string system_prompt = 1;
  string user_prompt_template = 2;   // placeholders: {context}, {batch}
  string model = 3;
}
