<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root {
  --bg: #fbf8f4; --sheet: #ffffff; --ink: #1f1b17; --muted: #6b625a; --rule: #e7dfd6; --rule-strong: #d6cbbf;
  --es: #a8461f; --ru: #2f5d8a; --accent: #a8461f; --accent-ink: #ffffff; --accent-soft: #f6e7de;
  --warn: #8a5a00; --warn-soft: #fbf0d6; --good: #2e7d4f; --good-soft: #e3f2e8; --bad: #b3261e; --bad-soft: #fbe4e2;
  --chip: #f1ebe4; --hover: #f7f1ea; --shadow: rgba(60, 40, 20, 0.10); --tip-bg: #1f1b17; --tip-ink: #fbf8f4;
  --seg1: #e6c2ad; --seg2: #f3e3d8;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120f; --sheet: #1e1a16; --ink: #efe9e2; --muted: #a89e93; --rule: #3a332b; --rule-strong: #4d443a;
    --es: #ec8f63; --ru: #8fb6de; --accent: #ec8f63; --accent-ink: #1b120c; --accent-soft: #3b2419;
    --warn: #e5b955; --warn-soft: #3a2f14; --good: #72c795; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3b1c19;
    --chip: #2a251f; --hover: #26211c; --shadow: rgba(0, 0, 0, 0.45); --tip-bg: #efe9e2; --tip-ink: #15120f; --seg1: #7a4129; --seg2: #4b2d1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120f; --sheet: #1e1a16; --ink: #efe9e2; --muted: #a89e93; --rule: #3a332b; --rule-strong: #4d443a;
  --es: #ec8f63; --ru: #8fb6de; --accent: #ec8f63; --accent-ink: #1b120c; --accent-soft: #3b2419;
  --warn: #e5b955; --warn-soft: #3a2f14; --good: #72c795; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3b1c19;
  --chip: #2a251f; --hover: #26211c; --shadow: rgba(0, 0, 0, 0.45); --tip-bg: #efe9e2; --tip-ink: #15120f; --seg1: #7a4129; --seg2: #4b2d1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 18px; display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); line-height: 1.15; text-wrap: balance; font-weight: 700; }
h2 { margin: 0; font-size: 18px; text-wrap: balance; }
h3 { margin: 0; font-size: 15px; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 90ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
.facts li { background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.facts b { font-variant-numeric: tabular-nums; }
.note-line { font-size: 13px; color: var(--muted); margin: 0; }
.banner { border: 1px solid var(--rule); background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: thin; }
nav.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
nav.tabs a:hover { background: var(--hover); color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs a small { font-weight: 500; opacity: 0.8; margin-left: 4px; font-variant-numeric: tabular-nums; }
main { padding-block: 18px 48px; display: grid; gap: 18px; }
section.tab { display: grid; gap: 14px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input[type="search"] { flex: 1 1 260px; max-width: 520px; min-width: 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font: inherit; }
.chip { border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.quiet { border-style: dashed; color: var(--muted); }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; min-width: 760px; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
table.grid th { position: sticky; top: 0; background: var(--sheet); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; user-select: none; }
table.grid th .label { cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
table.grid th .label:hover { color: var(--ink); }
table.grid th .grip { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; }
table.grid th .grip:hover, table.grid th .grip.on { background: var(--accent-soft); }
table.grid th { position: sticky; }
table.grid tbody tr:hover td { background: var(--hover); }
table.grid tr:last-child td { border-bottom: 0; }
.es { color: var(--es); font-weight: 600; }
.ru { color: var(--ru); }
.muted { color: var(--muted); }
.where { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.quote { font-family: var(--read); font-size: 14px; }
.badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.new { background: var(--good-soft); color: var(--good); }
.badge.doubt { background: var(--warn-soft); color: var(--warn); cursor: help; }
.badge.ru-latin { background: var(--bad-soft); color: var(--bad); }
.seen { font-size: 12.5px; color: var(--muted); cursor: help; }
.tip { position: fixed; z-index: 50; max-width: min(520px, calc(100vw - 32px)); background: var(--tip-bg); color: var(--tip-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px var(--shadow); pointer-events: none; }
.tip .t { font-family: var(--read); font-size: 14px; }
.tip .w { opacity: 0.75; font-size: 12px; margin-top: 4px; }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .rule { margin: 0; }
.card ul.ex { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.card ul.ex li { border-left: 3px solid var(--accent-soft); padding-left: 10px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.periods { display: grid; gap: 18px; }
.strip { display: flex; height: 26px; border-radius: 8px; overflow: hidden; border: 1px solid var(--rule); background: var(--chip); }
.strip span { display: block; height: 100%; border-right: 2px solid var(--sheet); cursor: pointer; }
.strip span:nth-child(odd) { background: var(--seg1); }
.strip span:nth-child(even) { background: var(--seg2); }
.strip span.on { background: var(--accent); }
.topics { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.topics li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 12px; padding: 10px 14px; border-top: 1px solid var(--rule); }
.topics li:first-child { border-top: 0; }
.topics li.on { background: var(--hover); }
@media (max-width: 560px) { .topics li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.notes { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); align-items: start; }
.note { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; min-width: 0; scroll-margin-top: 70px; }
.note.flash { box-shadow: 0 0 0 3px var(--accent); }
.note > .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 8px; }
.md { font-family: var(--read); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--sans); margin: 1.1em 0 0.4em; font-size: 1.05em; }
.md h1 { font-size: 1.2em; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-family: var(--sans); font-size: 13.5px; margin: 0.6em 0; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--chip); }
.md img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--rule); }
.md audio { width: 100%; max-width: 480px; }
.md code { font-size: 0.9em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.md pre { overflow-x: auto; background: var(--chip); padding: 10px; border-radius: 8px; }
.md blockquote { margin: 0.6em 0; padding: 6px 12px; border-left: 3px solid var(--rule-strong); color: var(--muted); }
.md .callout { border-left: 4px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 0 8px 8px 0; }
.md .callout .ct { font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; margin-bottom: 2px; }
.md li.task { list-style: none; margin-left: -1.3em; }
.md li.task input { margin-right: 6px; transform: translateY(1px); }
.md li.task.done > label { color: var(--muted); text-decoration: line-through; }
.md mark { background: var(--warn-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
.md a { color: var(--ru); }
.json-view { font-family: var(--sans); font-size: 14px; display: grid; gap: 10px; margin: 0.6em 0; }
.json-obj { display: grid; gap: 10px; }
.json-part { display: grid; gap: 4px; padding-left: 10px; border-left: 3px solid var(--accent-soft); }
.json-head { font-weight: 700; margin: 0; font-size: 13.5px; }
.json-key { font-weight: 600; color: var(--muted); }
.json-pairs { display: grid; gap: 2px; padding: 6px 10px; background: var(--chip); border-radius: 8px; }
.json-list { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.json-tasks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.json-tasks li { margin-left: 0 !important; }
.json-tasks input { margin-right: 6px; }
.json-src summary { font-size: 12px; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--rule-strong); border-radius: 10px; text-align: center; }
.practice { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); align-items: start; }
.flash-card { position: relative; min-height: 220px; border-radius: 14px; border: 1px solid var(--rule); background: var(--sheet); display: grid; place-items: center; text-align: center; padding: 22px; cursor: pointer; box-shadow: 0 2px 10px var(--shadow); }
.flash-card .front { font-size: clamp(22px, 3vw, 32px); font-weight: 700; }
.flash-card .back { display: grid; gap: 8px; }
.flash-card .back .meaning { font-size: 20px; font-weight: 600; }
.flash-card .hint { position: absolute; bottom: 10px; left: 0; right: 0; font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.act { border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
button.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.act:disabled { opacity: 0.5; cursor: default; }
.gap-q { font-family: var(--read); font-size: 18px; line-height: 1.55; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.gap-q .blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--es); font-weight: 700; }
.options { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.options button { text-align: left; }
.options button.right { background: var(--good-soft); border-color: var(--good); }
.options button.wrong { background: var(--bad-soft); border-color: var(--bad); }
.panel-title { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
footer { padding-block: 0 32px; color: var(--muted); font-size: 12.5px; }
.cards.small { grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
.block { gap: 6px; scroll-margin-top: 70px; }
.block .path, .mistake .path { font-size: 12px; color: var(--muted); }
.block .md { font-size: 14.5px; line-height: 1.55; }
.block .md h1, .block .md h2, .block .md h3, .block .md h4 { font-size: 1em; margin: 0.6em 0 0.2em; }
button.more { justify-self: start; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0; }
button.say { border: 0; background: none; cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; opacity: 0.7; vertical-align: baseline; }
button.say:hover { opacity: 1; }
ul.pairs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.pairs li { border-left: 3px solid var(--accent-soft); padding-left: 10px; display: grid; gap: 1px; }
ul.pairs .es { font-family: var(--read); font-weight: 600; }
.hide-ru .ru-hideable { filter: blur(5px); cursor: pointer; transition: filter 0.15s; }
.hide-ru .ru-hideable.shown { filter: none; }
.mistake .wrong { color: var(--bad); text-decoration: line-through; font-family: var(--read); font-size: 15px; }
.mistake .right { color: var(--good); font-weight: 600; font-family: var(--read); font-size: 15px; }
.task.done { opacity: 0.6; }
.doneline { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
ol.items { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: it; }
ol.items li { display: grid; gap: 4px; counter-increment: it; }
ol.items .p { font-family: var(--read); font-size: 15px; }
ol.items .p::before { content: counter(it) ". "; color: var(--muted); font-weight: 600; font-family: var(--sans); }
ol.items input, textarea.answer, .typing input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--bg); color: var(--ink); font: inherit; }
textarea.answer { min-height: 72px; resize: vertical; margin-top: 6px; }
details.keys { background: var(--good-soft); border-radius: 8px; padding: 6px 10px; }
.progress { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.2s; }
.srs-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.match button { text-align: left; overflow-wrap: anywhere; }
.match button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match button.ok { background: var(--good-soft); border-color: var(--good); opacity: 0.6; cursor: default; }
.match button.bad { background: var(--bad-soft); border-color: var(--bad); }
.typing .ask { font-size: 20px; font-weight: 600; color: var(--ru); }
.verdict.ok { color: var(--good); font-weight: 600; }
.verdict.bad { color: var(--bad); font-weight: 600; }
.block .md img { max-height: 160px; width: auto; margin: 2px; vertical-align: top; cursor: zoom-in; }
.block .md img.big { max-height: none; width: 100%; cursor: zoom-out; }
.card { grid-template-columns: minmax(0, 1fr); }
.card .where, .note .where { white-space: normal; }
button.act, .options button { overflow-wrap: anywhere; white-space: normal; }
.blank-inline { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--accent); margin: 0 2px; }
</style>
</head>
<body>

<header class="top wrap" id="top"></header>
<nav class="tabs" aria-label="Разделы"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="page-data">{{data}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('page-data').textContent);
  var P = D.package;
  var KEY = 'lesson-page-' + D.date + '-';

  function store(name, value) {
    try {
      if (value === undefined) { var v = localStorage.getItem(KEY + name); return v ? JSON.parse(v) : null; }
      if (value === null) localStorage.removeItem(KEY + name); else localStorage.setItem(KEY + name, JSON.stringify(value));
    } catch (e) { return null; }
    return null;
  }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fmtDate(d) { var p = d.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    return n + ' ' + (m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many);
  }
  var WHO = { teacher: 'преподаватель', student: 'ученик' };
  function where(r) {
    var parts = [];
    if (r.period != null) parts.push('запись ' + r.period);
    if (r.at) parts.push(r.at);
    if (r.who && WHO[r.who]) parts.push(WHO[r.who]);
    return parts.join(' · ');
  }
  var HOW = { explained: 'объяснено', asked: 'спрошено', corrected: 'исправлено', prompted: 'подсказано', used: 'сказано' };
  var POS = { noun: 'сущ.', verb: 'глагол', adjective: 'прил.', adverb: 'нареч.', phrase: 'выражение', expression: 'выражение', preposition: 'предлог', conjunction: 'союз', pronoun: 'местоим.', interjection: 'междом.' };
  var OKIND = { spanish: 'испанское', russian: 'русское латиницей', name: 'имя', english: 'английское', other: 'другое' };
  var GKIND = { explained: 'объяснено', corrected: 'исправление ошибки', asked: 'спрошено', used: 'употреблено' };

  /* ---------- tooltip ---------- */
  var tip = document.getElementById('tip');
  function showTip(ev, text, sub) {
    if (!text) return;
    tip.innerHTML = '';
    tip.appendChild(el('div', { class: 't', text: text }));
    if (sub) tip.appendChild(el('div', { class: 'w', text: sub }));
    tip.hidden = false;
    var x = (ev.clientX || 0) + 14, y = (ev.clientY || 0) + 16;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = Math.max(8, window.innerWidth - w - 8);
    if (y + h > window.innerHeight - 8) y = Math.max(8, (ev.clientY || 0) - h - 12);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.hidden = true; }
  function withTip(node, text, sub) {
    node.addEventListener('mouseenter', function (e) { showTip(e, text, sub); });
    node.addEventListener('mousemove', function (e) { showTip(e, text, sub); });
    node.addEventListener('mouseleave', hideTip);

  /* ---------- notes: markdown, sources ---------- */
  var KIND = { homework: 'ДЗ', summary: 'конспект', cards: 'карточки', dialogues: 'диалоги', topics: 'темы', transcript: 'расшифровка', log: 'журнал', other: 'заметка' };

  var CARD_LINES = 8;
  function renderMarkdown(md, noteId) {
    var box = el('div', { class: 'md' });

    });
    Array.prototype.forEach.call(box.querySelectorAll('pre > code'), function (code) {

  /* a JSON block of a note as lists: an object -> named parts, a list of texts -> items to tick off */

  /* ---------- practice ---------- */
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    var fresh = pk.filter(function (r) { return r.list !== 'code' && !(r.seenIn || []).length; });
    if (fresh.length) decks.push({ id: 'fresh', title: 'Новые слова урока', cards: fresh.map(card) });
    if (pk.length) decks.push({ id: 'all', title: 'Все слова пакета', cards: pk.map(card) });

  /* cards with spaced repetition (Leitner boxes): forgotten - again in a minute, remembered - in 1, 2, 4, 8, 16 days */
  function srsMode(deck) {

      stats.appendChild(el('span', { class: 'badge', text: 'новых: ' + b[0] }));

        face.appendChild(el('div', { class: 'hint', text: 'вспомните, потом нажмите или пробел — перевернуть' }));
      } else {
        face.appendChild(el('div', { class: 'back' }, [el('div', { class: 'muted', text: front }), el('div', { class: 'meaning ' + (dir === 'es' ? 'ru' : 'es') }, [back, dir === 'ru' ? sayBtn(c.es) : null]), c.quote ? el('div', { class: 'quote', text: '«' + c.quote + '»' }) : null, c.where ? el('div', { class: 'where', text: c.where }) : null]));

    function grade(g) {

  /* typing the Spanish for the Russian: recall is stronger than recognition */
  var PUNCT = /[¿¡!?.,;:«»"“”()…]/g;
  function exactEs(s) { return (s || '').toLowerCase().replace(PUNCT, ' ').replace(/\s+/g, ' ').trim(); }
  function plainEs(s) { return norm(s).replace(PUNCT, ' ').replace(/\s+/g, ' ').trim(); }

    return out;
  }
  function typingMode(deck) {
    var order = shuffle(deck.cards.filter(function (c) { return c.es && c.ru; }).slice());
    if (!order.length) return null;
    var i = 0, score = { ok: 0, all: 0 }, checked = false, hints = 0;
    var box = el('div', { class: 'card typing', style: 'gap:12px' });
    var ask = el('div', { class: 'ask' });
    var ctx = el('div', { class: 'where' });
    var inp = el('input', { type: 'text', placeholder: 'по-испански…', 'aria-label': 'Ответ по-испански', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    var verdict = el('div', { class: 'verdict' });
    var stat = el('span', { class: 'count' });
    var checkBtn = el('button', { class: 'act primary', type: 'button', text: 'Проверить' });
    var hintBtn = el('button', { class: 'act', type: 'button', text: 'Подсказка' });
    var nextBtn = el('button', { class: 'act', type: 'button', text: 'Дальше' });
    function cur() { return order[i % order.length]; }
    function draw() {
      var c = cur();
      ask.textContent = c.ru;
      ctx.textContent = c.where || '';
      inp.value = ''; verdict.textContent = ''; verdict.className = 'verdict'; checked = false; hints = 0;
      stat.textContent = score.all ? 'верно ' + score.ok + ' из ' + score.all : plural(order.length, 'карточка', 'карточки', 'карточек') + ' в колоде';

      var exact = A.some(function (a) { return exactEs(a) === exactEs(v) || bare(exactEs(a)) === bare(exactEs(v)); });

      else if (loose) { score.ok++; verdict.className = 'verdict ok'; verdict.appendChild(document.createTextNode('Верно, только ударения и ñ: ' + c.es + ' ')); }

    nextBtn.addEventListener('click', next);
    hintBtn.addEventListener('click', function () { var es = cur().es; hints = Math.min(es.length, hints + 1); verdict.className = 'verdict'; verdict.textContent = 'начинается так: ' + es.slice(0, hints) + '…'; inp.focus(); });

    box.appendChild(el('h3', { text: 'Напишите по-испански' }));
    box.appendChild(el('p', { class: 'muted', style: 'margin:0', text: 'Перевод → испанское слово или фраза. Артикль и ударения можно не писать — подскажу, как точно. Enter — проверить, ещё Enter — дальше.' }));
    box.appendChild(ask); box.appendChild(ctx); box.appendChild(inp); box.appendChild(verdict);
    box.appendChild(el('div', { class: 'row' }, [checkBtn, hintBtn, nextBtn, stat]));

  }

  /* matching: six pairs at a time */
  function matchMode(deck) {
    var pool = deck.cards.filter(function (c) { return c.es && c.ru && c.es.length <= 70 && c.ru.length <= 90; });
    if (pool.length < 4) return null;
    var box = el('div', { class: 'card', style: 'gap:12px' });
    var grid = el('div', { class: 'match' });
    var stat = el('span', { class: 'count' });
    var again = el('button', { class: 'act primary', type: 'button', text: 'Новый раунд' });
    var rounds = 0, misses = 0;
    function round() {
      grid.innerHTML = ''; misses = 0;
      var seenEs = {}, seenRu = {}, pick = [];
      shuffle(pool.slice()).forEach(function (c) { if (pick.length < 6 && !seenEs[norm(c.es)] && !seenRu[norm(c.ru)]) { seenEs[norm(c.es)] = seenRu[norm(c.ru)] = 1; pick.push(c); } });
      var left = el('div', { class: 'col', style: 'display:grid;gap:8px;align-content:start' });
      var right = el('div', { class: 'col', style: 'display:grid;gap:8px;align-content:start' });
      var sel = null, left_n = pick.length;
      function mk(c, side) {
        var b = el('button', { class: 'act' + (side === 'es' ? ' es' : ' ru'), type: 'button', text: side === 'es' ? c.es : c.ru });

        b.addEventListener('click', function () {
          if (b.classList.contains('ok')) return;

  /* a phrase with a word left out: the word in its living context */
  var LETTER = 'A-Za-zÁÉÍÓÚÑÜáéíóúñü';
  function gapItems(cards) {
    var items = [];
    cards.forEach(function (c) {
      var q = c.quote, idx = q && c.es && c.es.length >= 3 ? norm(q).indexOf(norm(c.es)) : -1;
      if (idx >= 0) { items.push({ before: q.slice(0, idx), after: q.slice(idx + c.es.length), answer: q.substr(idx, c.es.length), hint: c.ru, where: c.where }); return; }

      var long = [];
      words.forEach(function (w, i) { if (w.replace(new RegExp('[^' + LETTER + ']', 'g'), '').length >= 4) long.push(i); });

      items.push({ before: words.slice(0, k).join(' ') + (k ? ' ' : '') + m[1], after: m[3] + (k < words.length - 1 ? ' ' : '') + words.slice(k + 1).join(' '), answer: m[2], hint: c.ru, where: c.where });
    });

  }

    var answersAll = items.map(function (it) { return it.answer; }).filter(function (w, i, a) { return a.map(norm).indexOf(norm(w)) === i; });
    if (answersAll.length < 4) return null;
    var box = el('div', { class: 'card', style: 'gap:12px' });
    var score = { right: 0, all: 0 };
    var stat = el('span', { class: 'count' });
    var qBox = el('div', { class: 'gap-q' });
    var opts = el('div', { class: 'options' });
    var info = el('div', { class: 'where' });
    var next = el('button', { class: 'act primary', type: 'button', text: 'Дальше' });
    var order = shuffle(items.slice()), i = 0;
    function draw() {

      qBox.appendChild(el('span', { class: 'blank', text: '…' }));
      qBox.appendChild(document.createTextNode(it.after));

  var MODES = [
    { id: 'srs', title: 'Карточки с повторением', draw: srsMode },

    s.appendChild(deckRow);

  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('.ru-hideable') : null;
    if (t && t.closest('.hide-ru')) t.classList.toggle('shown');
    var img = e.target && e.target.closest ? e.target.closest('.block .md img') : null;
    if (img) img.classList.toggle('big');  // a picture of a card is small until clicked
  });
  drawHeader();
  drawTabs();
  window.addEventListener('hashchange', route);
  route();
  document.getElementById('foot').textContent = 'Страница собрана сборщиком пакета урока из данных XtractManager и заметок урока; заметки разложены по учебным вкладкам кодом, без модели.';
})();
</script>
</body>
</html>
